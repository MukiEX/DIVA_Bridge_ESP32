; DIVA Bridge ESP32
; USB DIVA controller (Divaller / ZhouSensor / HORI) -> Bluetooth Xbox pad +
; DIVA Bridge over Wi-Fi/BLE.
;
; Needs Arduino-ESP32 3.x (ESP-IDF 5.x) for USB hub support, so this uses the
; community pioarduino platform (the official PlatformIO platform stops at
; Arduino 2.x). Tested build: Arduino-ESP32 3.3.12, NimBLE-Arduino 2.5.2.

[platformio]
default_envs = esp32s3_devkit

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    ; The native USB port is a USB host here; serial goes over the board's
    ; USB-UART port, so don't start USB CDC on boot.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.3.6
    ; ESP32-BLE-CompositeHID is vendored in lib/ (with a multi-connection fix)
    tomstewart89/Callback @ ^1.1
board_build.partitions = partitions.csv

; Any ESP32-S3 DevKitC-style board (N8R2, N16R8, ...). The controller goes on
; the "USB"/OTG port through a powered hub; settings via the "UART"/COM port.
[env:esp32s3_devkit]
board = esp32-s3-devkitc-1

; Espressif ESP32-S3-USB-OTG: controller on the USB-A host port, settings via
; the micro-USB (UART) port. Host port power: `set otg_power usb|battery`.
[env:esp32s3_usb_otg]
board = esp32-s3-devkitc-1    ; same S3 module family (ESP32-S3-MINI-1-N8)
board_upload.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_S3_USB_OTG
