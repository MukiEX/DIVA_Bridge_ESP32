<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIVA Bridge ESP32 Flasher</title>
<style>
  :root {
    --bg: #15161b; --panel: #23252d; --line: #33363f; --text: #d8d8de;
    --dim: #6b6e7a; --cyan: #3fd7ea; --green: #4fd06a; --red: #f05050; --amber: #e8b04a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 780px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: .02em; }
  h1 span { color: var(--cyan); }
  .sub { color: var(--dim); margin: 0 0 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 14px 16px; margin-bottom: 14px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
              color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; align-items: center; }
  @media (max-width: 540px) { .grid { grid-template-columns: 1fr; } .grid > label { margin-top: 6px; } }
  label { color: var(--dim); }
  input, select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
                  border-radius: 6px; padding: 7px 9px; font: inherit; }
  input:focus, select:focus { outline: 1px solid var(--cyan); border-color: var(--cyan); }
  .check { display: flex; gap: 8px; align-items: center; }
  .check input { width: auto; }
  .check label { color: var(--text); }
  button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
           padding: 8px 14px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--cyan); }
  button.primary { background: var(--cyan); color: #0b1a1d; border-color: var(--cyan); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); display: inline-block; flex: none; }
  .dot.on { background: var(--green); }
  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 540px) { .boards { grid-template-columns: 1fr; } }
  .board { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: var(--bg); }
  .board.sel { border-color: var(--cyan); }
  .board b { display: block; }
  .board small { color: var(--dim); }
  .board input { display: none; }
  .steps { margin: 8px 0 0; padding-left: 20px; color: var(--dim); }
  .steps b { color: var(--text); font-weight: 600; }
  progress { width: 100%; height: 10px; accent-color: var(--cyan); }
  #log { height: 200px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
         padding: 8px; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; margin: 8px 0 0; }
  .hint { color: var(--dim); font-size: 12.5px; margin: 8px 0 0; }
  .warn { color: var(--amber); }
  .bad { color: var(--red); }
  .ok { color: var(--green); }
  code { color: var(--cyan); }
  .pw { display: flex; gap: 6px; }
  .pw input { flex: 1; }
  .pw button { padding: 6px 10px; }
</style>
</head>
<body>
<main>
  <h1>DIVA Bridge <span>ESP32</span> Flasher</h1>
  <p class="sub">Install the firmware and set up Wi-Fi from the browser (Chrome or Edge). Firmware <span id="fwver">—</span>.</p>

  <div class="panel">
    <h2>1 · Board</h2>
    <div class="boards" id="boards"></div>
    <ol class="steps" id="steps"></ol>
  </div>

  <div class="panel">
    <h2>2 · Connect</h2>
    <div class="row">
      <button id="connect" class="primary">Connect</button>
      <span class="dot" id="dot"></span><span id="conn">Not connected</span>
    </div>
    <p class="hint" id="nosupport" hidden><span class="bad">This browser has no Web Serial.</span> Use Chrome or Edge on a computer.</p>
  </div>

  <div class="panel">
    <h2>3 · Settings</h2>
    <div class="row" style="margin-bottom:10px">
      <button id="read" disabled>Read from board</button>
      <span class="hint" id="readinfo" style="margin:0"></span>
    </div>
    <div class="grid">
      <label for="ssid">Wi-Fi network</label><input id="ssid" autocomplete="off" placeholder="leave empty for Bluetooth only">
      <label for="pass">Wi-Fi password</label>
      <div class="pw"><input id="pass" type="password" autocomplete="new-password"><button id="showpw" type="button">Show</button></div>
      <label for="port">Bridge port</label><input id="port" type="number" min="1" max="65535" value="45710">
      <label for="radio">Radios</label>
      <select id="radio">
        <option value="both">Wi-Fi + Bluetooth</option>
        <option value="wifi">Wi-Fi only (lowest Wi-Fi latency, no Xbox pad)</option>
        <option value="ble">Bluetooth only</option>
      </select>
      <label for="name">Bluetooth name</label><input id="name" maxlength="28" value="DIVA Bridge">
      <label for="xbox">Pad profile</label>
      <select id="xbox"><option value="seriesx">Xbox Series X</option><option value="ones">Xbox One S</option></select>
      <label for="slider">Slider on the pad</label>
      <select id="slider">
        <option value="motion">Swipes push the sticks (left half → LS, right half → RS)</option>
        <option value="position">Touch position on the sticks</option>
        <option value="off">Off</option>
      </select>
      <label>Options</label>
      <div>
        <div class="check"><input type="checkbox" id="slider_reverse"><label for="slider_reverse">Reverse slider direction</label></div>
        <div class="check"><input type="checkbox" id="led_reverse"><label for="led_reverse">Reverse slider LEDs (ZhouSensor)</label></div>
        <div class="check"><input type="checkbox" id="leds" checked><label for="leds">Send LEDs to the controller</label></div>
        <div class="check"><input type="checkbox" id="unpair"><label for="unpair">Forget Bluetooth pairings</label></div>
      </div>
      <label for="otg_power" class="otgonly">Host port power</label>
      <select id="otg_power" class="otgonly"><option value="usb">From the USB_DEV plug</option><option value="battery">From the battery</option></select>
    </div>
  </div>

  <div class="panel">
    <h2>4 · Write</h2>
    <div class="row">
      <button id="install" class="primary" disabled>Install firmware + settings</button>
      <button id="update" disabled>Update firmware, keep settings</button>
      <button id="writecfg" disabled>Write settings only</button>
    </div>
    <div class="check" style="margin-top:10px"><input type="checkbox" id="eraseall"><label for="eraseall">Erase the whole flash first (clears pairings and everything else)</label></div>
    <div style="margin-top:12px"><progress id="prog" value="0" max="1"></progress></div>
    <div id="result" class="hint"></div>
    <pre id="log"></pre>
  </div>
</main>

<script type="module">
import { ESPLoader, Transport } from "https://cdn.jsdelivr.net/npm/esptool-js@0.6.1/bundle.js";

// Filled in by tools/build_flasher.py: per board, base64 images + offsets.
const FIRMWARE = /*FIRMWARE_JSON*/{"version": "dev", "boards": {}}/*END_FIRMWARE_JSON*/;

const CFG_OFFSET = 0x310000;   // "divacfg" in partitions.csv
const CFG_SIZE = 0x1000;
const BOARD_INFO = {
  esp32s3_devkit: {
    title: "ESP32-S3 DevKit (two USB ports)",
    blurb: "N8R2, N16R8, … — controller on the USB/OTG port via a powered hub",
    steps: [
      "Plug the <b>UART / COM</b> port into this computer.",
      "Click <b>Connect</b> and pick the port (CP210x / CH34x / USB Serial).",
      "It switches into flashing mode by itself. If not: hold <b>BOOT</b>, tap <b>RST</b>, release BOOT, try again.",
    ],
  },
  esp32s3_usb_otg: {
    title: "Espressif ESP32-S3-USB-OTG",
    blurb: "USB-A host port with power, battery connector",
    steps: [
      "Plug the <b>micro-USB (UART)</b> port into this computer.",
      "Click <b>Connect</b> and pick the port.",
      "If it doesn't respond: hold <b>BOOT</b>, tap <b>RST</b>, release BOOT, try again.",
    ],
  },
};

const $ = (id) => document.getElementById(id);
const FIELDS = ["ssid", "pass", "port", "radio", "name", "xbox", "slider", "otg_power"];
const FLAGS = ["slider_reverse", "led_reverse", "leds"];
let board = null, transport = null, loader = null, busy = false;
let lastSerial = 0;

// ---------------------------------------------------------------- blob
// Must match src/ConfigBlob.cpp (checked by test/test_config_blob.py).
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (const b of bytes) c = CRC_TABLE[(c ^ b) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function encodeBlob(text, serial) {
  const payload = new TextEncoder().encode(text);
  if (payload.length > CFG_SIZE - 16) throw new Error("settings too long");
  const out = new Uint8Array(CFG_SIZE).fill(0xFF);
  const dv = new DataView(out.buffer);
  out.set([0x44, 0x56, 0x43, 0x46], 0);           // "DVCF"
  dv.setUint16(4, 1, true);                         // version
  dv.setUint16(6, payload.length, true);
  dv.setUint32(8, serial >>> 0, true);
  dv.setUint32(12, crc32(payload), true);
  out.set(payload, 16);
  return out;
}
function decodeBlob(bytes) {
  if (bytes.length < 16) return null;
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if (bytes[0] !== 0x44 || bytes[1] !== 0x56 || bytes[2] !== 0x43 || bytes[3] !== 0x46) return null;
  if (dv.getUint16(4, true) !== 1) return null;
  const len = dv.getUint16(6, true);
  if (16 + len > bytes.length) return null;
  const payload = bytes.subarray(16, 16 + len);
  if (crc32(payload) !== dv.getUint32(12, true)) return null;
  const text = new TextDecoder().decode(payload);
  const kv = {};
  for (const line of text.split(/\r?\n/)) {
    const i = line.indexOf("=");
    if (i > 0) kv[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1);
  }
  return { serial: dv.getUint32(8, true), kv };
}
function formText() {
  const clean = (v) => String(v).replace(/[\r\n]/g, "");
  let t = "";
  for (const k of FIELDS) t += `${k}=${clean($(k).value)}\n`;
  for (const k of FLAGS) t += `${k}=${$(k).checked ? 1 : 0}\n`;
  if ($("unpair").checked) t += "unpair=1\n";
  return t;
}
function newSerial() {
  let s;
  do { s = crypto.getRandomValues(new Uint32Array(1))[0]; } while (s === 0 || s === lastSerial);
  return s;
}
window.__blob = { encodeBlob, decodeBlob, crc32 };  // for tests

// ---------------------------------------------------------------- UI
function log(t, cls) {
  const el = $("log");
  const line = document.createElement("div");
  line.textContent = t;
  if (cls) line.className = cls;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
const terminal = { clean() {}, writeLine: (d) => log(d), write: (d) => log(d) };

function b64(str) {
  const bin = atob(str);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function renderBoards() {
  const keys = Object.keys(BOARD_INFO).filter((k) => FIRMWARE.boards[k] || !Object.keys(FIRMWARE.boards).length);
  $("boards").innerHTML = "";
  for (const k of keys) {
    const info = BOARD_INFO[k];
    const el = document.createElement("label");
    el.className = "board";
    el.innerHTML = `<input type="radio" name="board" value="${k}"><b>${info.title}</b><small>${info.blurb}</small>`;
    el.querySelector("input").onchange = () => selectBoard(k);
    $("boards").appendChild(el);
  }
  selectBoard(keys[0]);
}
function selectBoard(k) {
  board = k;
  for (const el of document.querySelectorAll(".board")) {
    const on = el.querySelector("input").value === k;
    el.classList.toggle("sel", on);
    el.querySelector("input").checked = on;
  }
  $("steps").innerHTML = BOARD_INFO[k].steps.map((s) => `<li>${s}</li>`).join("");
  for (const el of document.querySelectorAll(".otgonly")) el.style.display = k === "esp32s3_usb_otg" ? "" : "none";
}

function setBusy(b) {
  busy = b;
  const connected = !!loader;
  $("connect").disabled = b;
  for (const id of ["read", "writecfg"]) $(id).disabled = b || !connected;
  const haveFw = !!FIRMWARE.boards[board];
  for (const id of ["install", "update"]) $(id).disabled = b || !connected || !haveFw;
}
function setConnected(text) {
  $("dot").classList.toggle("on", !!loader);
  $("conn").textContent = text || (loader ? "Connected" : "Not connected");
  $("connect").textContent = loader ? "Disconnect" : "Connect";
  setBusy(false);
}

async function disconnect() {
  try { if (transport) await transport.disconnect(); } catch (e) {}
  transport = loader = null;
  setConnected();
}

$("connect").onclick = async () => {
  if (loader) return disconnect();
  try {
    const port = await navigator.serial.requestPort();
    transport = new Transport(port, false);
    loader = new ESPLoader({ transport, baudrate: 921600, terminal, debugLogging: false });
    setBusy(true);
    $("conn").textContent = "Connecting…";
    const chip = await loader.main();
    if (!/ESP32-S3/i.test(chip)) log(`Warning: this is a ${chip}, the firmware is for the ESP32-S3.`, "warn");
    setConnected(`Connected: ${chip}`);
    await readSettings(true);
  } catch (e) {
    log("Connect failed: " + (e.message || e), "bad");
    await disconnect();
  }
};

async function readSettings(quiet) {
  setBusy(true);
  try {
    const data = await loader.readFlash(CFG_OFFSET, CFG_SIZE);
    const blob = decodeBlob(data);
    if (!blob) {
      $("readinfo").textContent = "No settings on the board yet.";
      if (!quiet) log("No DIVA Bridge settings found on the board (new board or other firmware).");
      return;
    }
    lastSerial = blob.serial;
    for (const k of FIELDS) if (k in blob.kv) $(k).value = blob.kv[k];
    for (const k of FLAGS) if (k in blob.kv) $(k).checked = blob.kv[k] === "1";
    $("unpair").checked = false;
    $("readinfo").textContent = "Loaded the board's current settings.";
    log("Read settings from the board.", "ok");
  } catch (e) {
    log("Couldn't read settings: " + (e.message || e), "bad");
  } finally {
    setBusy(false);
  }
}
$("read").onclick = () => readSettings(false);

function validate() {
  const port = Number($("port").value);
  if (!(port > 0 && port < 65536)) return "Port must be 1–65535.";
  if (!$("name").value.trim()) return "Bluetooth name can't be empty.";
  if ($("ssid").value && $("radio").value === "ble") return null;  // fine, just unused
  return null;
}

async function write(mode) {
  const err = mode !== "update" ? validate() : null;
  if (err) { $("result").innerHTML = `<span class="bad">${err}</span>`; return; }
  const files = [];
  if (mode !== "settings") {
    const fw = FIRMWARE.boards[board];
    for (const part of fw.parts) files.push({ address: part.offset, data: b64(part.data), name: part.name });
  }
  if (mode !== "update" || $("eraseall").checked) {
    lastSerial = newSerial();
    files.push({ address: CFG_OFFSET, data: encodeBlob(formText(), lastSerial), name: "settings" });
  }
  setBusy(true);
  $("result").textContent = "";
  $("prog").value = 0;
  try {
    const total = files.reduce((a, f) => a + f.data.length, 0);
    const before = files.map((f, i) => files.slice(0, i).reduce((a, g) => a + g.data.length, 0));
    log(`Writing ${files.map((f) => f.name).join(", ")}…`);
    await loader.writeFlash({
      fileArray: files.map((f) => ({ data: f.data, address: f.address })),
      flashMode: "keep", flashFreq: "keep", flashSize: "keep",
      eraseAll: mode !== "settings" && $("eraseall").checked,
      compress: true,
      reportProgress: (i, written, size) => {
        $("prog").value = (before[i] + (written / size) * files[i].data.length) / total;
      },
    });
    $("prog").value = 1;
    log("Done. Restarting the board…", "ok");
    await loader.after("hard_reset");
    $("result").innerHTML = '<span class="ok">Done.</span> The board restarts and applies the settings. ' +
      'If it doesn’t start, unplug it and plug it back in. Its address shows up in your router, ' +
      'or as <code>' + ($("name").value.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "diva-bridge") + '.local</code>.';
    $("unpair").checked = false;
    await disconnect();
  } catch (e) {
    log("Write failed: " + (e.message || e), "bad");
    $("result").innerHTML = '<span class="bad">Write failed.</span> Check the cable and the steps above, then connect again.';
    setBusy(false);
  }
}
$("install").onclick = () => write("install");
$("update").onclick = () => write("update");
$("writecfg").onclick = () => write("settings");

$("showpw").onclick = () => {
  const p = $("pass");
  p.type = p.type === "password" ? "text" : "password";
  $("showpw").textContent = p.type === "password" ? "Show" : "Hide";
};

$("fwver").textContent = FIRMWARE.version;
if (!("serial" in navigator)) { $("nosupport").hidden = false; $("connect").disabled = true; }
renderBoards();
setConnected();
if (!Object.keys(FIRMWARE.boards).length) log("This page has no firmware built in (template). Settings can still be written.", "warn");
</script>
</body>
</html>
